[project]
name = "rag-docs-service"
version = "0.1.0"
description = "Microservices documentation RAG assistant with FastAPI, pgvector, Taskiq, and Streamlit"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "taskiq>=0.11.0",
    "streamlit>=1.40.0",
    "fastembed>=0.9.0",
    "langchain-openai>=1.7.2",
    "httpx2>=2.16.0",
    "neo4j>=6.4.1",
    "qdrant-client>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Share one event loop across all async tests. The module-level asyncpg engine
# pools connections bound to the loop they were created on; function-scoped
# loops would leave test 2 with stale connections from test 1's closed loop
# ("attached to a different loop" / "Event loop is closed").
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.uv.workspace]
members = []

