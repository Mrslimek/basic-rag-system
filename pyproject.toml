[project]
name = "rag-docs-service"
version = "0.1.0"
description = "Microservices documentation RAG assistant with FastAPI, Haystack, Qdrant, Neo4j, Taskiq, and Streamlit"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "taskiq>=0.11.0",
    "streamlit>=1.40.0",
    "fastembed>=0.9.0",
    "httpx2>=2.16.0",
    # Bolt 5.x line shared with the Neo4j 5.26 server; <6 stays out of the 6.0
    # protocol major.
    "neo4j>=5.16,<6",
    "qdrant-client>=1.20.0",
    "haystack-ai>=3.4.1",
    "qdrant-haystack>=13.1.0",
    "fastembed-haystack>=3.0.0",
    "pydantic-ai>=2.63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Share one event loop across all async tests. The module-level asyncpg engine
# pools connections bound to the loop they were created on; function-scoped
# loops would leave test 2 with stale connections from test 1's closed loop
# ("attached to a different loop" / "Event loop is closed").
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.93",
]

