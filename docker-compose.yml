services:
  db:
    image: pgvector/pgvector:pg18
    container_name: rag_docs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_docs_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-rag_docs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26
    container_name: rag_docs_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-graphrag123}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474" # Browser UI: http://localhost:7474
      - "7687:7687" # Bolt protocol used by the python driver
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
